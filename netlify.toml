[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Local `npm run dev` serves the API itself. `netlify dev` can proxy to Vite.
[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Function paths (config.path = "/api/*") are served by Netlify directly.
# This fallback is only for the client-side router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
